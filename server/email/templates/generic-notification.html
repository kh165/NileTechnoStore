{{> header}}
<div style="text-align: right;">
  {{#if badgeText}}
  <div style="display: inline-block; background-color: #dbeafe; color: #1e40af; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; margin-bottom: 16px;">
    {{badgeText}}
  </div>
  {{/if}}
  
  {{#if title}}
  <h1 style="margin: 0 0 16px 0; color: #0f172a; font-size: 24px; font-weight: 800; line-height: 1.3;">
    {{title}}
  </h1>
  {{/if}}

  <div style="color: #334155; font-size: 15px; line-height: 1.7; margin-bottom: 24px;">
    {{{messageHtml}}}
  </div>

  {{#if actionUrl}}
  <div style="text-align: center; margin: 32px 0;">
    <a href="{{actionUrl}}" class="btn-primary" style="display: inline-block; background-color: #2563eb; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 700; padding: 14px 32px; border-radius: 10px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);">
      {{#if actionText}}{{actionText}}{{else}}عرض التفاصيل{{/if}}
    </a>
  </div>
  {{/if}}
</div>
{{> footer}}
